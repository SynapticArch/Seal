name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Increase Gradle memory
        run: echo "GRADLE_OPTS=-Xmx14g" >> $GITHUB_ENV

      - name: Build with Gradle and tee log
        run: gradle assembleRelease 2>&1 | tee build.log

      - name: Sign app APK
        id: sign_app
        uses: ilharp/sign-android-release@nightly
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
          retention-days: 20

      - name: Get timestamp and short sha
        id: timestamp
        run: |
          echo "repo_name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Automatic release
        if: success()
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ steps.timestamp.outputs.timestamp }}
          prerelease: false
          title: "${{ steps.timestamp.outputs.repo_name }}-${{ steps.timestamp.outputs.short_sha }} Release"
          files: app/build/outputs/apk/release/*-signed.apk

      - name: Install node dependencies for log upload
        run: |
          cd .github/workflows
          npm install

      - name: Upload build log if failed
        env:
          LOG_SCRIPT_PATH: .github/workflows/upload-log.js
          LOG_FILE_PATH: build.log
        run: node $LOG_SCRIPT_PATH
